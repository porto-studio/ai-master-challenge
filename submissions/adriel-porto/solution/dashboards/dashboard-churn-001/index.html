<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — RavenStack Churn 001</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Dashboard de leitura — dados brutos</h1>
    <p class="sub">Importa um CSV, filtra sem alterar o original, mostra gráficos e salva um novo arquivo a cada exportação.</p>
  </header>

  <section id="import-box">
    <label class="file-label">
      <input type="file" id="fileInput" accept=".csv" />
      Escolher arquivo CSV
    </label>
    <span id="fileInfo">Nenhum arquivo carregado ainda.</span>
  </section>

  <main id="app" hidden>
    <aside id="filters">
      <h2>Filtros</h2>
      <div id="filterList"></div>
      <button id="resetFilters">Restaurar todos os filtros</button>
    </aside>

    <section id="content">
      <div class="stats">
        <div class="stat-card">
          <span class="stat-value" id="totalRows">0</span>
          <span class="stat-label">linhas no arquivo original</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="filteredRows">0</span>
          <span class="stat-label">linhas depois do filtro</span>
        </div>
      </div>

      <div class="charts">
        <div class="chart-card">
          <div class="chart-controls">
            <label>Gráfico de pizza — coluna:
              <select id="pieColumn"></select>
            </label>
          </div>
          <div class="chart-canvas-wrap"><canvas id="pieChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-controls">
            <label>Linha do tempo — coluna de data:
              <select id="dateColumn"></select>
            </label>
            <label>Agrupar por:
              <select id="dateGrain">
                <option value="month">Mês</option>
                <option value="year">Ano</option>
              </select>
            </label>
            <label>Medir:
              <select id="dateMetric">
                <option value="count">Contagem de linhas</option>
                <option value="sum_mrr">Soma de mrr_amount</option>
              </select>
            </label>
          </div>
          <div class="chart-canvas-wrap"><canvas id="lineChart"></canvas></div>
        </div>
      </div>

      <div class="table-wrap">
        <h2>Prévia dos dados filtrados (primeiras 50 linhas)</h2>
        <div class="table-scroll">
          <table id="previewTable"></table>
        </div>
      </div>

      <div class="save-box">
        <button id="saveBtn">Salvar CSV filtrado (novo arquivo, não substitui o anterior)</button>
        <span id="saveInfo"></span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
